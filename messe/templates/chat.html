<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Talkify - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-slate-800 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-400">Talkify Chat</h1>
        <div class="flex items-center gap-4">
            <span class="text-sm bg-indigo-600/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30">Foydalanuvchi: <b>{{ username }}</b></span>
            <a href="{% url 'index' %}" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1 rounded-lg text-sm border border-red-500/30 transition">Chiqish (Logout)</a>
        </div>
    </header>

    <!-- Xabarlar chiqadigan joy -->
    <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4 flex flex-col">
        {% for msg in messages %}
            <div class="flex flex-col max-w-xs lg:max-w-md px-4 py-2 rounded-2xl {% if msg.username == username %} ml-auto bg-indigo-600 text-white rounded-br-none {% else %} mr-auto bg-slate-800 border border-slate-700 rounded-bl-none text-slate-200 {% endif %}">
                <div class="text-xs {% if msg.username == username %} text-indigo-200 {% else %} text-indigo-400 {% endif %} font-bold mb-1">{{ msg.username }}</div>

                {% if msg.body %}
                    <div class="text-sm break-words">{{ msg.body }}</div>
                {% endif %}

                {% if msg.image %}
                    <img src="{{ msg.image.url }}" class="mt-2 rounded-xl max-h-60 object-cover">
                {% endif %}
            </div>
        {% endfor %}
    </div>

    <!-- Tanlangan rasmlar chiqib turadigan qism (Preview) -->
    <div id="image-preview-container" class="px-6 flex gap-2 flex-wrap bg-slate-800/50 pt-2"></div>

    <!-- Xabar va rasm yuborish paneli -->
    <div class="bg-slate-800 p-4 border-t border-slate-700">
        <div class="max-w-4xl mx-auto flex items-center gap-3">

            <!-- Rasm tanlash tugmasi (Bir nechta rasm olish uchun multiple qo'shildi) -->
            <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 px-3 py-3 rounded-xl flex items-center justify-center text-white transition border border-slate-600" title="Rasm yuklash">
                📷
                <input type="file" id="chat-image-input" accept="image/*" multiple class="hidden">
            </label>

            <!-- Matn kiritish inputi -->
            <input id="chat-message-input" type="text" placeholder="Xabar yozing..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-sm" autocomplete="off">

            <!-- Yuborish tugmasi -->
            <button id="chat-message-submit" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/30 text-sm">Yuborish</button>
        </div>
    </div>

    <!-- JavaScript qismi -->
    <script>
        const username = "{{ username }}";
        const chatMessages = document.querySelector('#chat-messages');
        const imageInput = document.querySelector('#chat-image-input');
        const previewContainer = document.querySelector('#image-preview-container');

        let selectedFiles = []; // Tanlangan rasmlar massivi

        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Rasmlar tanlanganda ularni saqlash va ekranda preview qilish (X tugmasi bilan)
        imageInput.addEventListener('change', function() {
            const files = Array.from(imageInput.files);
            files.forEach(file => {
                selectedFiles.push(file);
            });
            renderPreviews();
            imageInput.value = ''; // Inputni tozalash, shunda bir xil rasmni qayta tanlasa ham ishlaydi
        });

        function renderPreviews() {
            previewContainer.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const div = document.createElement('div');
                    div.className = "relative inline-block";
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-16 h-16 object-cover rounded-lg border border-slate-600">
                        <button onclick="removeImage(${index})" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold hover:bg-red-700">&times;</button>
                    `;
                    previewContainer.appendChild(div);
                }
                reader.readAsDataURL(file);
            });
        }

        // X tugmasi bosilganda rasmni ro'yxatdan o'chirish
        window.removeImage = function(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        // WebSocket ulanishi
        const wsScheme = window.location.protocol === "https:" ? "wss://" : "ws://";
        const chatSocket = new WebSocket(
            wsScheme + window.location.host + '/ws/chat/'
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            let messageDiv = document.createElement('div');

            if (data.username === username) {
                messageDiv.className = "flex flex-col max-w-xs lg:max-w-md px-4 py-2 rounded-2xl ml-auto bg-indigo-600 text-white rounded-br-none";
            } else {
                messageDiv.className = "flex flex-col max-w-xs lg:max-w-md px-4 py-2 rounded-2xl mr-auto bg-slate-800 border border-slate-700 rounded-bl-none text-slate-200";
            }

            let htmlContent = `<div class="text-xs ${data.username === username ? 'text-indigo-200' : 'text-indigo-400'} font-bold mb-1">${data.username}</div>`;

            if (data.message) {
                htmlContent += `<div class="text-sm break-words">${data.message}</div>`;
            }
            if (data.image_url) {
                htmlContent += `<img src="${data.image_url}" class="mt-2 rounded-xl max-h-60 object-cover">`;
            }

            messageDiv.innerHTML = htmlContent;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        document.querySelector('#chat-message-input').focus();
        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.keyCode === 13) {
                document.querySelector('#chat-message-submit').click();
            }
        };

        // Yuborish tugmasi
        document.querySelector('#chat-message-submit').onclick = async function(e) {
            const messageInputDom = document.querySelector('#chat-message-input');
            const message = messageInputDom.value;

            if (message.trim() === "" && selectedFiles.length === 0) return;

            const formData = new FormData();
            formData.append('username', username);
            formData.append('body', message);

            selectedFiles.forEach(file => {
                formData.append('images', file);
            });

            // CSRF tokenni to'g'ri olish
            const csrfToken = document.cookie.split('; ')
                .find(row => row.startsWith('csrftoken='))
                ?.split('=')[1];

            try {
                let response = await fetch('/send-message/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken
                    },
                    body: formData
                });

                if (response.ok) {
                    messageInputDom.value = '';
                    selectedFiles = [];
                    previewContainer.innerHTML = '';
                } else {
                    alert("Xatolik yuz berdi!");
                }
            } catch (err) {
                console.error("Tarmoq xatoligi:", err);
                alert("Xatolik yuz berdi!");
            }
        };
    </script>
</body>
</html>
